<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深度研究助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; padding: 24px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  .box { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  input[type=text] { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
  button { margin-top: 10px; padding: 10px 22px; font-size: 15px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #93b4f5; cursor: not-allowed; }
  #logs { font-size: 13px; line-height: 1.8; color: #555; white-space: pre-wrap; max-height: 260px; overflow-y: auto; }
  #report { line-height: 1.8; }
  #report h1 { font-size: 20px; margin: 16px 0 8px; }
  #report h2 { font-size: 17px; margin: 14px 0 6px; }
  #report h3 { font-size: 15px; margin: 12px 0 6px; }
  #report p, #report li { font-size: 14px; margin: 6px 0; }
  #report table { border-collapse: collapse; margin: 8px 0; }
  #report th, #report td { border: 1px solid #ddd; padding: 6px 10px; font-size: 13px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; margin-left: 8px; }
  .status.pending { background: #fef3c7; color: #92400e; }
  .status.running { background: #dbeafe; color: #1d4ed8; }
  .status.completed { background: #dcfce7; color: #166534; }
  .status.failed { background: #fee2e2; color: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 深度研究助手</h1>

  <div class="box">
    <input id="topic" type="text" placeholder="输入研究主题，如：2026 年主流 Agent 框架对比" />
    <button id="go" onclick="start()">开始研究</button>
  </div>

  <div class="box" id="statusBox" style="display:none">
    <b>研究状态</b><span id="status" class="status pending">pending</span>
    <div id="logs"></div>
  </div>

  <div class="box" id="reportBox" style="display:none">
    <div id="report"></div>
  </div>
</div>

<script>
let rid = null, timer = null;

async function start() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { alert('请输入研究主题'); return; }

  document.getElementById('go').disabled = true;
  document.getElementById('statusBox').style.display = 'block';
  document.getElementById('reportBox').style.display = 'none';
  document.getElementById('logs').textContent = '';

  const resp = await fetch('/api/research', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic }),
  }).then(r => r.json());
  rid = resp.research_id;
  setStatus('pending');
  timer = setInterval(poll, 2000);
}

async function poll() {
  const d = await fetch('/api/research/' + rid).then(r => r.json());
  setStatus(d.status);
  document.getElementById('logs').textContent = (d.logs || []).join('\n');
  const logsEl = document.getElementById('logs');
  logsEl.scrollTop = logsEl.scrollHeight;

  if (d.status === 'completed') {
    clearInterval(timer);
    document.getElementById('reportBox').style.display = 'block';
    document.getElementById('report').innerHTML = marked.parse(d.report || '');
    document.getElementById('go').disabled = false;
  } else if (d.status === 'failed') {
    clearInterval(timer);
    document.getElementById('logs').textContent += '\n❌ 失败：' + (d.error || '');
    document.getElementById('go').disabled = false;
  }
}

function setStatus(s) {
  const el = document.getElementById('status');
  el.textContent = s;
  el.className = 'status ' + s;
}
</script>
</body>
</html>
