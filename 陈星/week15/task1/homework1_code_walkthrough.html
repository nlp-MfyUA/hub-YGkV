e":25,"code":"","note":"","highlight":""},{"line":26,"code":"","note":"","highlight":""},{"line":27,"code":"def _keyword_hits(text: str, keywords: tuple[str, ...]) -> set[str]:","note":"返回词表中在句子里出现的不同词。","highlight":"\u003cspan class=\"tok-kw\">def\u003c/span> _keyword_hits(text: str, keywords: tuple[str, ...]) -&gt; set[str]:"},{"line":28,"code":"    english_words = set(re.findall(r\"[a-z]+\", text))","note":"从已转小写的文本提取英文字母序列，供整词匹配。","highlight":"    english_words = set(re.findall(\u003cspan class=\"tok-str\">r&quot;[a-z]+&quot;\u003c/span>, text))"},{"line":29,"code":"    return {word for word in keywords if (word in english_words if word.isascii() else word in text)}","note":"英语匹配整个词，中文查片段。集合让重复词只计一次。","highlight":"    \u003cspan class=\"tok-kw\">return\u003c/span> {word \u003cspan class=\"tok-kw\">for\u003c/span> word \u003cspan class=\"tok-kw\">in\u003c/span> keywords \u003cspan class=\"tok-kw\">if\u003c/span> (word \u003cspan class=\"tok-kw\">in\u003c/span> english_words \u003cspan class=\"tok-kw\">if\u003c/span> word.isascii() \u003cspan class=\"tok-kw\">else\u003c/span> word \u003cspan class=\"tok-kw\">in\u003c/span> text)}"},{"line":30,"code":"","note":"","highlight":""},{"line":31,"code":"","note":"","highlight":""},{"line":32,"code":"def analyze_sentiment_rule(text: str) -> SentimentResult:","note":"定义规则版分类器，返回与模型输出同形状的对象。","highlight":"\u003cspan class=\"tok-kw\">def\u003c/span> analyze_sentiment_rule(text: str) -&gt; SentimentResult:"},{"line":33,"code":"    lowered = text.lower()","note":"统一英文大小写，中文字符保持原样。","highlight":"    lowered = text.lower()"},{"line":34,"code":"    negated = _NEGATED_WORD.findall(lowered)","note":"提取预先列出的否定短语对应的情绪词。","highlight":"    negated = _NEGATED_WORD.findall(lowered)"},{"line":35,"code":"    remaining = _NEGATED_WORD.sub(\" \", lowered)","note":"先用空格替换命中片段，避免把短语内部的词再计一次。","highlight":"    remaining = _NEGATED_WORD.sub(\u003cspan class=\"tok-str\">&quot; &quot;\u003c/span>, lowered)"},{"line":36,"code":"    positive = _keyword_hits(remaining, _POSITIVE_KEYWORDS)","note":"找出剩余文本中命中的正向词。","highlight":"    positive = _keyword_hits(remaining, _POSITIVE_KEYWORDS)"},{"line":37,"code":"    negative = _keyword_hits(remaining, _NEGATIVE_KEYWORDS)","note":"找出剩余文本中命中的负面词。","highlight":"    negative = _keyword_hits(remaining, _NEGATIVE_KEYWORDS)"},{"line":38,"code":"    positive.update(f\"不{word}\" for word in negated if word in _NEGATIVE_KEYWORDS)","note":"负面词前加“不”时，按这张演示规则表计入正向。","highlight":"    positive.update(\u003cspan class=\"tok-str\">f&quot;\u003c/span>\u003cspan class=\"tok-str\">不\u003c/span>{word}\u003cspan class=\"tok-str\">&quot;\u003c/span> \u003cspan class=\"tok-kw\">for\u003c/span> word \u003cspan class=\"tok-kw\">in\u003c/span> negated \u003cspan class=\"tok-kw\">if\u003c/span> word \u003cspan class=\"tok-kw\">in\u003c/span> _NEGATIVE_KEYWORDS)"},{"line":39,"code":"    negative.update(f\"不{word}\" for word in negated if word in _POSITIVE_KEYWORDS)","note":"正向词前加“不”时，按这张演示规则表计入负面。","highlight":"    negative.update(\u003cspan class=\"tok-str\">f&quot;\u003c/span>\u003cspan class=\"tok-str\">不\u003c/span>{word}\u003cspan class=\"tok-str\">&quot;\u003c/span> \u003cspan class=\"tok-kw\">for\u003c/span> word \u003cspan class=\"tok-kw\">in\u003c/span> negated \u003cspan class=\"tok-kw\">if\u003c/span> word \u003cspan class=\"tok-kw\">in\u003c/span> _POSITIVE_KEYWORDS)"},{"line":40,"code":"","note":"","highlight":""},{"line":41,"code":"    if negative and len(negative) >= len(positive):","note":"有负面词且负面数量不少于正向词时，走排解分支。","highlight":"    \u003cspan class=\"tok-kw\">if\u003c/span> negative \u003cspan class=\"tok-kw\">and\u003c/span> len(negative) &gt;= len(positive):"},{"line":42,"code":"        sentiment, matched = \"negative\", negative","note":"保存负面标签和命中词，供结果对象使用。","highlight":"        sentiment, matched = \u003cspan class=\"tok-str\">&quot;negative&quot;\u003c/span>, negative"},{"line":43,"code":"    elif positive:","note":"剩余情况有正向词时，走鼓励分支。","highlight":"    \u003cspan class=\"tok-kw\">elif\u003c/span> positive:"},{"line":44,"code":"        sentiment, matched = \"positive\", positive","note":"保存正向标签和命中词。","highlight":"        sentiment, matched = \u003cspan class=\"tok-str\">&quot;positive&quot;\u003c/span>, positive"},{"line":45,"code":"    else:","note":"两个集合都为空时执行默认规则。","highlight":"    \u003cspan class=\"tok-kw\">else\u003c/span>:"},{"line":46,"code":"        return SentimentResult(","note":"按作业的两分支约定返回分类对象。","highlight":"        \u003cspan class=\"tok-kw\">return\u003c/span> SentimentResult("},{"line":47,"code":"            sentiment=\"positive\", confidence=0.5,","note":"未命中场景走 positive，用较低的参考值标记不确定性。","highlight":"            sentiment=\u003cspan class=\"tok-str\">&quot;positive&quot;\u003c/span>, confidence=\u003cspan class=\"tok-num\">0.5\u003c/span>,"},{"line":48,"code":"            reason=\"离线词表未命中，按二分类演示约定走鼓励分支。\",","note":"把默认决策写入原因，方便区分真实命中和默认分支。","highlight":"            reason=\u003cspan class=\"tok-str\">&quot;离线词表未命中，按二分类演示约定走鼓励分支。&quot;\u003c/span>,"},{"line":49,"code":"        )","note":"结束默认分类返回。","highlight":"        )"},{"line":50,"code":"","note":"","highlight":""},{"line":51,"code":"    score = min(0.95, 0.6 + 0.08 * abs(len(positive) - len(negative)))","note":"两类命中数差越大，参考值越高，上限 0.95。这是手工评分。","highlight":"    score = min(\u003cspan class=\"tok-num\">0.95\u003c/span>, \u003cspan class=\"tok-num\">0.6\u003c/span> + \u003cspan class=\"tok-num\">0.08\u003c/span> * abs(len(positive) - len(negative)))"},{"line":52,"code":"    return SentimentResult(","note":"用选中的标签、参考值和命中说明构造结果。","highlight":"    \u003cspan class=\"tok-kw\">return\u003c/span> SentimentResult("},{"line":53,"code":"        sentiment=sentiment,","note":"写入上面确定的情感分支。","highlight":"        sentiment=sentiment,"},{"line":54,"code":"        confidence=round(score, 2),","note":"将演示参考值保留两位小数。","highlight":"        confidence=round(score, \u003cspan class=\"tok-num\">2\u003c/span>),"},{"line":55,"code":"        reason=f\"离线词表命中：{'、'.join(sorted(matched)[:3])}。\",","note":"先排序保证输出稳定，最多展示三个词。","highlight":"        reason=\u003cspan class=\"tok-str\">f&quot;\u003c/span>\u003cspan class=\"tok-str\">离线词表命中：\u003c/span>{\u003cspan class=\"tok-str\">&#x27;、&#x27;\u003c/span>.join(sorted(matched)[:\u003cspan class=\"tok-num\">3\u003c/span>])}\u003cspan class=\"tok-str\">。\u003c/span>\u003cspan class=\"tok-str\">&quot;\u003c/span>,"},{"line":56,"code":"    )","note":"完成分类结果对象。","highlight":"    )"},{"line":57,"code":"","note":"","highlight":""},{"line":58,"code":"","note":"","highlight":""},{"line":59,"code":"def generate_reply_rule(sentiment: SentimentType) -> str:","note":"接受已选定的标签，返回离线回应文本。","highlight":"\u003cspan class=\"tok-kw\">def\u003c/span> generate_reply_rule(sentiment: SentimentType) -&gt; str:"},{"line":60,"code":"    if sentiment == \"positive\":","note":"判断是否走鼓励模板。","highlight":"    \u003cspan class=\"tok-kw\">if\u003c/span> sentiment == \u003cspan class=\"tok-str\">&quot;positive&quot;\u003c/span>:"},{"line":61,"code":"        return \"谢谢你分享这一刻。如果有值得肯定的小进展，可以花一点时间记下来，给自己一点鼓励。\"","note":"正向分支给出温和、留有空间的鼓励。","highlight":"        \u003cspan class=\"tok-kw\">return\u003c/span> \u003cspan class=\"tok-str\">&quot;谢谢你分享这一刻。如果有值得肯定的小进展，可以花一点时间记下来，给自己一点鼓励。&quot;\u003c/span>"},{"line":62,"code":"    return \"听起来这件事让你有些不好受，先给自己一点缓冲的时间。等你准备好了，可以先想想眼下哪一件小事是你能处理的。\"","note":"负面分支先共情，再给出一个轻量的小步骤。","highlight":"    \u003cspan class=\"tok-kw\">return\u003c/span> \u003cspan class=\"tok-str\">&quot;听起来这件事让你有些不好受，先给自己一点缓冲的时间。等你准备好了，可以先想想眼下哪一件小事是你能处理的。&quot;\u003c/span>"},{"line":63,"code":"","note":"","highlight":""},{"line":64,"code":"","note":"","highlight":""},{"line":65,"code":"def extract_json_dict(raw: str) -> dict:","note":"把模型的原始字符串解析为 JSON 对象。","highlight":"\u003cspan class=\"tok-kw\">def\u003c/span> extract_json_dict(raw: str) -&gt; dict:"},{"line":66,"code":"    \"\"\"接受完整 JSON 对象，也兼容单层 Markdown 代码围栏。\"\"\"","note":"兼容完整 JSON 文本和包着 JSON 的一层 Markdown 围栏。","highlight":"    \u003cspan class=\"tok-str\">&quot;&quot;&quot;接受完整 JSON 对象，也兼容单层 Markdown 代码围栏。&quot;&quot;&quot;\u003c/span>"},{"line":67,"code":"    cleaned = raw.strip()","note":"去掉原始模型输出的首尾空白。","highlight":"    cleaned = raw.strip()"},{"line":68,"code":"    fenced = re.fullmatch(r\"```(?:json)?\\s*(.*?)\\s*```\", cleaned, flags=re.DOTALL | re.IGNORECASE)","note":"只有整段符合围栏格式才剥离围栏。DOTALL 允许跨行。","highlight":"    fenced = re.fullmatch(\u003cspan class=\"tok-str\">r&quot;```(?:json)?\\s*(.*?)\\s*```&quot;\u003c/span>, cleaned, flags=re.DOTALL | re.IGNORECASE)"},{"line":69,"code":"    value = json.loads(fenced.group(1) if fenced else cleaned)","note":"交给标准库解析。无效 JSON 会触发 JSONDecodeError。","highlight":"    value = json.loads(fenced.group(\u003cspan class=\"tok-num\">1\u003c/span>) \u003cspan class=\"tok-kw\">if\u003c/span> fenced \u003cspan class=\"tok-kw\">else\u003c/span> cleaned)"},{"line":70,"code":"    if not isinstance(value, dict):","note":"有效 JSON 也可能是列表、数字或字符串，这里要求对象。","highlight":"    \u003cspan class=\"tok-kw\">if\u003c/span> \u003cspan class=\"tok-kw\">not\u003c/span> isinstance(value, dict):"},{"line":71,"code":"        raise ValueError(\"Expected a JSON object.\")","note":"不是对象就抛出错误，由进程 1 返回明确的服务错误。","highlight":"        \u003cspan class=\"tok-kw\">raise\u003c/span> ValueError(\u003cspan class=\"tok-str\">&quot;Expected a JSON object.&quot;\u003c/span>)"},{"line":72,"code":"    return value","note":"返回字典，让 SentimentResult 继续校验具体字段。","highlight":"    \u003cspan class=\"tok-kw\">return\u003c/span> value"}]}]</script>
<script>
"use strict";
const files = JSON.parse(document.querySelector("#source-data").textContent);
const groups = Object.groupBy ? Object.groupBy(files, file => file.group) :
  files.reduce((grouped, file) => {
    (grouped[file.group] ??= []).push(file);
    return grouped;
  }, {});
const comparisons = {
  compare1: {
    title: "进程 1 · 情感识别",
    summary: "LangGraph 在分类节点中解析 JSON，再用 Pydantic 校验。Agents SDK 从 Agent 的 output_type 得到结构化结果。两者返回相同的字段。",
    filename: "process1_sentiment.py",
  },
  compare2: {
    title: "进程 2 · 鼓励与排解",
    summary: "LangGraph 的条件边根据标签选择节点。Agents SDK 版先用 Python 选择唯一目标，再要求 SDK 执行 Handoff，最后校验实际接手者。",
    filename: "process2_responder.py",
  },
};
const prefixes = ["langgraph_impl/", "openai_agents_impl/"];
const nav = document.querySelector("#files");
const picker = document.querySelector("#file-picker");
const search = document.querySelector("#search");
const content = document.querySelector("#content");
const blankButton = document.querySelector("#blank");
const themeButton = document.querySelector("#theme");
const modes = [...document.querySelectorAll("[data-mode]")];
let current = files[0].path;
let mode = "single";
let hideBlank = false;
let selectedLine = "";

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function selectFile(path) {
  current = path;
  mode = "single";
  selectedLine = "";
  if (search.value) search.value = "";
  render();
}

for (const [name, items] of Object.entries(groups)) {
  const heading = document.createElement("h3");
  heading.textContent = name;
  nav.append(heading);

  const optgroup = document.createElement("optgroup");
  optgroup.label = name;
  for (const file of items) {
    const fileButton = document.createElement("button");
    fileButton.type = "button";
    fileButton.className = "file-button";
    fileButton.append(file.badge);
    const shortPath = document.createElement("code");
    shortPath.textContent = file.path.split("/").at(-1);
    fileButton.append(shortPath);
    fileButton.dataset.path = file.path;
    fileButton.addEventListener("click", () => selectFile(file.path));
    nav.append(fileButton);

    const option = document.createElement("option");
    option.value = file.path;
    option.textContent = `${file.badge} · ${shortPath.textContent}`;
    optgroup.append(option);
  }
  picker.append(optgroup);
}

function buildPane(file, rows, compared) {
  const heading = compared ? `<h3 class="pane-head">${escapeHtml(file.group)}<span>${escapeHtml(file.path)} · ${escapeHtml(file.port)}</span></h3>` : "";
  if (!rows.length) {
    return `<section class="code-pane">${heading}<p class="empty">没有匹配的代码或解析。</p></section>`;
  }
  const rowHtml = rows.map(row => {
    const key = `${file.path}:${row.line}`;
    const selected = key === selectedLine;
    return `<tr data-line="${escapeHtml(key)}" class="${row.code.trim() ? "" : "blank"} ${selected ? "selected" : ""}">
      <td class="ln"><button type="button" data-select-line aria-pressed="${selected}" aria-label="标记第 ${row.line} 行">${row.line}</button></td>
      <td class="source"><code>${row.highlight || "&nbsp;"}</code></td>
      <td class="note">${escapeHtml(row.note)}</td>
    </tr>`;
  }).join("");
  return `<section class="code-pane ${compared ? "stacked" : ""}">${heading}
    <table aria-label="${escapeHtml(file.path)} 逐行解析">
      <thead><tr><th scope="col">行号</th><th scope="col" class="code-head">Python 源码</th><th scope="col">这一行的作用</th></tr></thead>
      <tbody>${rowHtml}</tbody>
    </table>
  </section>`;
}

function render() {
  const query = search.value.trim().toLocaleLowerCase();
  const comparison = comparisons[mode];
  const activeFiles = comparison
    ? prefixes.map(prefix => files.find(file => file.path === prefix + comparison.filename))
    : [files.find(file => file.path === current)];
  const [active] = activeFiles;
  document.querySelector("#badge").textContent = comparison
    ? "双框架对照" : active.group + (active.port ? ` · ${active.port}` : "");
  document.querySelector("#title").textContent = comparison ? comparison.title : active.path;
  document.querySelector("#summary").textContent = comparison ? comparison.summary : active.summary;
  picker.value = current;
  nav.querySelectorAll("[data-path]").forEach(button =>
    button.setAttribute("aria-current", String(!comparison && button.dataset.path === current)));
  modes.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
  blankButton.setAttribute("aria-pressed", String(hideBlank));
  blankButton.textContent = hideBlank ? "显示空行" : "隐藏空行";

  const filtered = activeFiles.map(file => file.rows.filter(row => {
    if (hideBlank && !row.code.trim()) return false;
    return !query || [row.code, row.note].some(text => text.toLocaleLowerCase().includes(query));
  }));
  const shown = filtered.reduce((total, rows) => total + rows.length, 0);
  const total = activeFiles.reduce((count, file) => count + file.rows.length, 0);
  document.querySelector("#results").textContent = `显示 ${shown} / ${total} 行 · 点击行号可标记`;
  const panes = activeFiles.map((file, i) => buildPane(file, filtered[i], !!comparison)).join("");
  content.innerHTML = comparison ? `<div class="compare-grid">${panes}</div>` : panes;
}

function setTheme(isDark) {
  document.documentElement.dataset.theme = isDark ? "dark" : "light";
  themeButton.setAttribute("aria-pressed", String(isDark));
  themeButton.textContent = isDark ? "切换浅色" : "深色模式";
}

try { setTheme(localStorage.getItem("homework1-reader-theme") === "dark"); }
catch { setTheme(false); }

themeButton.addEventListener("click", () => {
  const isDark = document.documentElement.dataset.theme !== "dark";
  setTheme(isDark);
  try { localStorage.setItem("homework1-reader-theme", isDark ? "dark" : "light"); }
  catch { /* 当前浏览器禁止本地保存时仍可切换主题。 */ }
});

picker.addEventListener("change", () => selectFile(picker.value));
search.addEventListener("input", render);
blankButton.addEventListener("click", () => { hideBlank = !hideBlank; render(); });
modes.forEach(button => button.addEventListener("click", () => {
  mode = button.dataset.mode;
  selectedLine = "";
  search.value = "";
  render();
}));
content.addEventListener("click", event => {
  const button = event.target.closest("[data-select-line]");
  if (!button) return;
  const row = button.closest("[data-line]");
  const old = content.querySelector(".selected");
  if (old) {
    old.classList.remove("selected");
    old.querySelector("button").setAttribute("aria-pressed", "false");
  }
  selectedLine = selectedLine === row.dataset.line ? "" : row.dataset.line;
  if (selectedLine) {
    row.classList.add("selected");
    button.setAttribute("aria-pressed", "true");
  }
});
document.querySelector("#stats").textContent = `${files.length} 个文件 · ${files.reduce((count, file) => count + file.rows.length, 0)} 行`;
render();
</script>
</body>
</html>
