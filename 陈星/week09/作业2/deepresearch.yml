    - data:
        code: "import json\n\ndef main(bocha_response) -> dict:\n    data = bocha_response\n\
          \    if isinstance(data, str):\n        try:\n            data = json.loads(data)\n\
          \        except Exception:\n            return {\"urls\": [], \"search_text\"\
          : \"\"}\n\n    pages = []\n    if isinstance(data, list):\n        for block\
          \ in data:\n            if isinstance(block, dict):\n                pages.extend(block.get(\"\
          webpage\") or [])\n    elif isinstance(data, dict):\n        # legacy shapes\n\
          \        pages = (\n            data.get(\"webpage\")\n            or data.get(\"\
          data\", {}).get(\"webPages\", {}).get(\"value\")\n            or []\n  \
          \      )\n\n    urls = []\n    lines = []\n    for i, item in enumerate(pages,\
          \ 1):\n        if not isinstance(item, dict):\n            continue\n  \
          \      url = item.get(\"url\") or \"\"\n        name = item.get(\"name\"\
          ) or \"\"\n        snippet = item.get(\"summary\") or item.get(\"snippet\"\
          ) or \"\"\n        site = item.get(\"siteName\") or \"\"\n        if url:\n\
          \            urls.append(url)\n        lines.append(f\"[{i}] {name}\\n来源:\
          \ {site}\\nURL: {url}\\n摘要: {snippet}\")\n\n    return {\"urls\": urls,\
          \ \"search_text\": \"\\n\\n\".join(lines)}\n"
