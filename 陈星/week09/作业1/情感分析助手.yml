    - data:
        code: "def main(text: str) -> dict:\n    raw = text or \"\"\n    if \"</think>\"\
          \ in raw:\n        raw = raw.split(\"</think>\")[-1]\n    raw = raw.strip()\n\
          \    # also handle chinese labels appearing after think\n    if \"负面情感\"\
          \ in raw and \"正向情感\" not in raw:\n        label = \"负面情感\"\n    elif raw.endswith(\"\
          负面情感\") or raw.split()[-1:] == [\"负面情感\"]:\n        label = \"负面情感\"\n \
          \   elif \"负面情感\" in raw and raw.rfind(\"负面情感\") > raw.rfind(\"正向情感\"):\n\
          \        label = \"负面情感\"\n    elif \"正向情感\" in raw:\n        label = \"\
          正向情感\"\n    else:\n        # fallback\n        label = \"负面情感\" if (\"压力\"\
          \ in raw or \"难过\" in raw or \"焦虑\" in raw) else \"正向情感\"\n    # Prefer\
          \ last non-empty line\n    lines = [ln.strip() for ln in raw.splitlines()\
          \ if ln.strip()]\n    if lines:\n        last = lines[-1]\n        if last\
          \ in (\"正向情感\", \"负面情感\"):\n            label = last\n        elif \"负面情感\"\
          \ in last:\n            label = \"负面情感\"\n        elif \"正向情感\" in last:\n\
          \            label = \"正向情感\"\n    return {\"label\": label}\n"
        code_language: python3
        outputs:
          label:
            type: string
