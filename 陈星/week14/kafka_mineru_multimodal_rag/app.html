<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 多模态问答</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;margin:auto;max-width:1000px;padding:30px;background:#f5f7fb;color:#20324a}
section{background:white;padding:24px;border:1px solid #dde4ed;border-radius:16px;margin:20px 0}
button{background:#285bd4;color:white;border:0;padding:9px 18px;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5} textarea{box-sizing:border-box;width:100%;min-height:100px;padding:12px;border:1px solid #bac6d5;border-radius:8px}
small{color:#52647c}.doc{padding:12px 0;border-bottom:1px solid #edf0f5}.doc span{margin-right:12px}
#answer p{white-space:pre-wrap}figure{margin:20px 0}figure img{max-width:100%;max-height:600px}#notice{color:#b33232}
</style>
<h1>PDF 多模态问答</h1><p>把文档交给解析队列，再带着文字或图片来提问。</p>
<section><h2>上传资料</h2><p><small>支持多个 PDF。每个文件不超过 30 MiB；一次最多 10 个。</small></p>
<input id="pdfs" type="file" accept="application/pdf" multiple><button id="upload">上传 PDF</button>
<div id="docs"></div></section>
<section><h2>向文档提问</h2><small>所有解析完成的文档参与检索。可同时附上一张 PNG、JPEG 或 WEBP 图片，不超过 8 MiB。</small>
<p><textarea id="question" placeholder="例如：这张图与文档中的哪张结构图有关？请结合原图解释。"></textarea></p>
<input id="image" type="file" accept="image/png,image/jpeg,image/webp"><input id="session" placeholder="会话 ID（可留空）" value="demo-session"><button id="ask">发送问题</button>
<div id="answer" aria-live="polite"></div></section><p id="notice" role="status"></p>
<script>
const $ = id => document.getElementById(id);
const labels = {queued:'待解析',processing:'解析中（含图片描述和索引）',ready:'解析完成',failed:'解析失败'};
async function request(url,options){
  const response=await fetch(url,options), body=await response.json();
  if(!response.ok) throw Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail||body));
  return body;
}
async function refresh(){
  const docs=await request('/documents'); $('docs').replaceChildren();
  for(const doc of docs){
    const row=document.createElement('div');row.className='doc';
    for(const text of [doc.name,labels[doc.status],doc.error]){
      const span=document.createElement('span');span.textContent=text;row.append(span);
    }
    if(doc.status==='failed'){
      const button=document.createElement('button');button.textContent='重试';
      button.onclick=async()=>{try{await request(`/documents/${doc.id}/retry`,{method:'POST'});await refresh();}catch(e){$('notice').textContent=e.message;}};
      row.append(button);
    }
    $('docs').append(row);
  }
}
$('upload').onclick=async()=>{
  $('notice').textContent='';$('upload').disabled=true;
  try{
    const form=new FormData();for(const file of $('pdfs').files)form.append('files',file);
    if(!$('pdfs').files.length)throw Error('请先选择 PDF。');
    await request('/documents',{method:'POST',body:form});$('pdfs').value='';await refresh();
  }catch(e){$('notice').textContent=e.message;}finally{$('upload').disabled=false;}
};
$('ask').onclick=async()=>{
  $('notice').textContent='';$('ask').disabled=true;$('answer').textContent='正在检索资料并生成回答……';
  try{
    const form=new FormData();form.append('question',$('question').value);form.append('session_id',$('session').value);
    if($('image').files[0])form.append('image',$('image').files[0]);
    const result=await request('/chat',{method:'POST',body:form});$('answer').replaceChildren();
    for(const block of result.blocks){
      if(block.type==='text'){const p=document.createElement('p');p.textContent=block.text;$('answer').append(p);}
      else if(block.type==='image'){
        const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');
        img.src=block.url;img.alt=`引用图片 ${block.source_id}`;
        caption.textContent=`[${block.source_id}] ${result.sources[block.source_id].name} · 第 ${result.sources[block.source_id].page} 页`;
        figure.append(img,caption);$('answer').append(figure);
      }
    }
    for(const [id,source] of Object.entries(result.sources)){
      const a=document.createElement('a');a.href=source.pdf;a.target='_blank';a.rel='noopener';
      a.textContent=`[${id}] ${source.name} · 第 ${source.page} 页`;
      const p=document.createElement('p');p.append(a);$('answer').append(p);
    }
  }catch(e){$('answer').textContent='';$('notice').textContent=e.message;}finally{$('ask').disabled=false;}
};
async function poll(){try{await refresh();}catch(e){$('notice').textContent=e.message;}finally{setTimeout(poll,2000);}}
poll();
</script></html>
