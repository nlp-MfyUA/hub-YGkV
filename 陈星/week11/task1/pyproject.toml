[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinook-sql-agent"
version = "1.0.0"
description = "Chinook SQLite 七阶段多 Agent 工作流作业"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.19,<0.20",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sql-agent = "sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
