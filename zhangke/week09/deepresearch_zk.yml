          role: system
          text: '你是一个问题分解规器，善于把问题为3到5个不同的更小的角度，这些角度可以互补并覆盖整体问题。你需要做的是：

            - 把问题拆解成适合检索的各个方面的短语，不要太长，需要短小并精确

            - 将拆分成的问题，用json字符串数组方式返回，例如 ["元素1"， “元素2”， “元素3”]， 除了这个数组，不要返回思考过程和其他任何内容

            - 将总问题，拆分成各个方面，例如用户输入“深度学习”， 可以拆分成 ["深度学习发展历史"， “深度学习重点论文”， “如何入门深度学习”
            ，“参数训练方式”] 等方面

            '
        - id: 6a98a492-8db3-4fbe-9143-d6578d2daa54
          role: user
          text: '{{#1789568639281.search_something#}}'
        selected: false
        title: LLM
        type: llm
        vision:
          enabled: false
      height: 88
