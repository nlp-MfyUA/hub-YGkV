    - data:
        code: "\nimport json\nimport re\n\n\ndef main(text: str) -> dict:\n    raw\
          \ = (text or \"\").strip()\n    t = raw\n\n    # 1. 去掉可能的 markdown 代码块包裹（容忍前后有说明文字）\n\
          \    t = re.sub(r'^```(?:json)?\\s*', '', t, flags=re.I)\n    t = re.sub(r'\\\
          s*```\\s*$', '', t).strip()\n\n    # 2. 依次尝试：整段 -> 代码块内 -> 第一个平衡的 [...]\
          \ -> 兜底\n    candidates = [t]\n\n    # 2a. 提取所有 markdown 代码块内容\n    for\
          \ block in re.findall(r'```(?:json)?\\s*(.*?)\\s*```', raw, flags=re.I |\
          \ re.S):\n        candidates.append(block.strip())\n\n    # 2b. 用非贪婪抽第一个\
          \ [...]，作为最后候选\n    m = re.search(r'\\[.*?\\]', t, re.S)\n    if m:\n  \
          \      candidates.append(m.group(0))\n\n    arr = None\n    for c in candidates:\n\
          \        if not c:\n            continue\n        try:\n            parsed\
          \ = json.loads(c)\n        except Exception:\n            continue\n   \
          \     if isinstance(parsed, list):\n            arr = parsed\n         \
          \   break\n\n    # 3. 兜底：用原始整句\n    if arr is None:\n        arr = [raw]\n\
          \n    # 4. 清洗：只保留非空字符串\n    queries = []\n    for x in arr:\n        if\
          \ isinstance(x, str):\n            s = x.strip()\n            if s:\n  \
          \              queries.append(s)\n        elif x is not None:\n        \
          \    s = str(x).strip()\n            if s:\n                queries.append(s)\n\
          \n    results = queries[:5] or [\"\"]\n    return {\"results\": results}\n"
        code_language: python3
