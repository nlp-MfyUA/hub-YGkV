    - data:
        code: "import json\nimport requests\n\ndef main(keywords):\n    if not isinstance(keywords,\
          \ list):\n        return {\"results\": \"\"}\n\n    all_results = []\n \
          \   for kw in keywords:\n        try:\n            r = requests.post(\n\
          \                \"https://api.bocha.cn/v1/web-search\",\n             \
          \   headers={\n                    \"Authorization\": \"Bearer sk-3d2293ad83aa4823a7c7ce8dd5ff8c72\"\
          ,\n                    \"Content-Type\": \"application/json\"\n        \
          \        },\n                json={\"query\": kw, \"summary\": True, \"\
          count\": 5},\n                timeout=20\n            )\n            data\
          \ = r.json()\n            pages = data.get(\"data\", {}).get(\"webPages\"\
          , {}).get(\"value\", [])\n            for page in pages:\n             \
          \   title = page.get(\"name\", \"\")\n                url = page.get(\"\
          url\", \"\")\n                summary = page.get(\"summary\", \"\") or page.get(\"\
          snippet\", \"\")\n                site = page.get(\"siteName\", \"\")\n\
          \                all_results.append(f\"[{title}]\\nSource: {site}\\nURL:\
          \ {url}\\nSummary: {summary}\\n\")\n        except Exception as e:\n   \
          \         all_results.append(f\"Search '{kw}' failed: {str(e)}\\n\")\n\n\
          \    json_string = json.dumps(all_results, ensure_ascii=False)\n    return\
          \ {\"results\": json_string}"
