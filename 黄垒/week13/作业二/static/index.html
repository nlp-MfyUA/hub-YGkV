<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Chinook 数据问答 · LangGraph SQL Agent</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="侧栏">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <ellipse cx="12" cy="5.5" rx="7" ry="3"></ellipse>
            <path d="M5 5.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
            <path d="M5 11.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <strong>Chinook ChatBI</strong>
          <span>LangGraph SQL Agent</span>
        </div>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        新对话
      </button>

      <div class="side-section">
        <h2>试试这样问</h2>
        <div class="examples" id="examples"></div>
      </div>

      <div class="side-foot">
        <div class="db-card">
          <span class="db-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <ellipse cx="12" cy="5.5" rx="7" ry="3"></ellipse>
              <path d="M5 5.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
              <path d="M5 11.5v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
            </svg>
          </span>
          <div class="db-text">
            <strong>chinook.db</strong>
            <span id="dbMeta">音乐商店数据集</span>
          </div>
        </div>
        <p class="tip">只读连接 · 仅允许 SELECT · 单次最多 100 行</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>

        <div class="topbar-title">
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span id="statusText">正在连接服务…</span>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
              <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"></path>
            </svg>
          </button>
          <button class="new-chat-sm" id="newChatTop" type="button">新对话</button>
        </div>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="empty" id="empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-4 4v-4H5.5A1.5 1.5 0 0 1 4 14.5v-9Z"></path>
              <path d="M8 9h8M8 12h5"></path>
            </svg>
          </div>
          <h1>用一句话，问出数据库里的答案</h1>
          <p>自然语言 → 选表 → 写 SQL → 校验 → 执行 → 结论，全部由 LangGraph 编排。</p>
          <div class="example-grid" id="exampleGrid"></div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <form class="composer" id="composer">
        <div class="composer-inner">
          <textarea
            id="input"
            rows="1"
            maxlength="500"
            placeholder="例如：销售额最高的 5 位客户是谁？"
            aria-label="输入问题"
          ></textarea>
          <button class="send" id="send" type="submit" disabled aria-label="发送">
            <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <path d="M12 19V5M6 11l6-6 6 6"></path>
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
            </svg>
          </button>
        </div>
        <div class="composer-hint">
          <span>Enter 发送 · Shift + Enter 换行</span>
          <span id="charCount">0 / 500</span>
        </div>
      </form>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <noscript>
    <p style="padding:24px">这个页面需要启用 JavaScript。</p>
  </noscript>

  <script src="/static/app.js"></script>
</body>
</html>
