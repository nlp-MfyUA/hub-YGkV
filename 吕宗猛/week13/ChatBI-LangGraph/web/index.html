<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBI · 对话问数（LangGraph）</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <ellipse cx="12" cy="6" rx="7" ry="3"></ellipse>
            <path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6"></path>
            <path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>ChatBI</h1>
          <span class="badge">LangGraph</span>
        </div>
      </div>
      <div class="top-meta" id="top-meta">数据集读取中…</div>
    </header>

    <main class="chat" id="chat">
      <div class="empty" id="empty">
        <div class="empty-mark">◇</div>
        <p>用中文问一句，Graph 自动完成 解析 → 生成 → 复核 → 执行 → 归纳</p>
        <div class="examples" id="examples">
          <button type="button" class="chip">2010 年各国销售额前 5 名</button>
          <button type="button" class="chip">消费金额最高的 10 位客户</button>
          <button type="button" class="chip">各音乐流派的曲目数量排行</button>
          <button type="button" class="chip">哪位员工负责的客户最多</button>
          <button type="button" class="chip">Rock 流派最贵的 5 首歌</button>
        </div>
        <p class="empty-hint">支持追问：先问「2010 年各国销售额前 5 名」，再问「那 2011 年呢」</p>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea id="input" rows="2" maxlength="2000"
        placeholder="用中文描述你想看的数据，例如：2010 年销售额最高的 5 个国家"></textarea>
      <div class="composer-bar">
        <span class="hint">Enter 发送 · Shift + Enter 换行</span>
        <div class="composer-actions">
          <button type="button" id="stop" hidden>停止</button>
          <button type="submit" id="send">发送</button>
        </div>
      </div>
    </form>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
