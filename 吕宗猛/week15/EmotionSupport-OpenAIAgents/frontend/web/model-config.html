<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模型配置 · 心屿</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="config-body">
  <div class="config-shell">
    <div class="config-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 22c3.5-4.5 7-4.5 10.5 0s7 4.5 10.5 0" stroke-linecap="round"></path>
          <path d="M16 7c-2.8-3.2-7.5-1.4-7.5 3 0 4.2 7.5 9 7.5 9s7.5-4.8 7.5-9c0-4.4-4.7-6.2-7.5-3Z"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1>心屿</h1>
        <p>EMOTION COMPANION</p>
      </div>
    </div>

    <div class="config-card">
      <p class="eyebrow">FIRST THINGS FIRST</p>
      <h2>先连接一个模型</h2>
      <p class="config-sub">聊天之前，请先配置 OpenAI 兼容模型网关。配置会保存在本地 SQLite，之后可直接进入聊天。</p>

      <form id="model-form" class="config-form">
        <label class="config-field">
          <span>Base URL</span>
          <input id="base-url" name="base_url" type="url" required placeholder="http://host.docker.internal:3425/v1" />
        </label>
        <label class="config-field">
          <span>API Key</span>
          <input id="api-key" name="api_key" type="password" placeholder="没有鉴权可留空" autocomplete="off" />
        </label>
        <label class="config-field">
          <span>模型名称</span>
          <input id="model-name" name="model_name" type="text" required placeholder="workbuddy/deepseek-v4.1-flash" />
        </label>
        <button type="submit" class="config-submit" id="config-submit">保存并开始</button>
        <div class="config-status hidden" id="config-status"></div>
      </form>

      <a class="config-back hidden" id="back-link" href="/">当前已配置，返回聊天 →</a>
    </div>
  </div>
  <script src="/static/model-config.js" defer></script>
</body>
</html>
