name: rag-mm

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rag-mm-kafka
    restart: unless-stopped
    ports:
      - "0.0.0.0:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://192.168.124.88:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ../data/kafka:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 25s
    networks:
      - default

  mineru:
    build:
      context: ./mineru
      dockerfile: Dockerfile
      network: host
    image: rag-mm-mineru:latest
    container_name: rag-mm-mineru
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MINERU_MODEL_SOURCE=modelscope
    volumes:
      - ../data/mineru:/root/.mineru
    shm_size: 1g
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    networks:
      - default

  api:
    build:
      context: ..
      dockerfile: app/Dockerfile
      network: host
    image: rag-mm-api:latest
    container_name: rag-mm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
    volumes:
      - ../data:/data
    ports:
      - "0.0.0.0:8002:8000"
    depends_on:
      kafka:
        condition: service_healthy
      mineru:
        condition: service_started
    mem_limit: 512m
    networks:
      - default
      - rag-internal

  worker:
    image: rag-mm-api:latest
    container_name: rag-mm-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.main"]
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
    volumes:
      - ../data:/data
    depends_on:
      kafka:
        condition: service_healthy
      mineru:
        condition: service_started
    mem_limit: 1g
    networks:
      - default
      - rag-internal

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      network: host
    image: rag-mm-web:latest
    container_name: rag-mm-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8082:80"
    depends_on:
      - api
    mem_limit: 128m
    networks:
      - default

networks:
  default:
    name: rag-mm-internal
  rag-internal:
    external: true
    name: rag_rag-internal
