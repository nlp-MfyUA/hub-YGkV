    - data:
        code: "def main(text: str):\n    import json\n    import re\n    text = text\
          \ or \"\"\n\n    # 1) 剥掉 <think>...</think> 思考块（块内可能含 {} 示例，必须先去掉）\n   \
          \ text = re.sub(r'<think>.*?</think>', '', text, flags=re.S | re.I)\n  \
          \  text = re.sub(r'</?think>', '', text, flags=re.I)\n\n    # 2) 全角符号转半角的备用文本\n\
          \    fixed = (text.replace('：', ':')\n                 .replace('“', '\"\
          ').replace('”', '\"')\n                 .replace('［', '[').replace('］',\
          \ ']')\n                 .replace('｛', '{').replace('｝', '}'))\n\n    #\
          \ 3) 依次尝试每个 '{' 起始位置，找到第一个能完整解析出来的 JSON 对象\n    data = None\n    for s in\
          \ (text, fixed):\n        decoder = json.JSONDecoder()\n        for m in\
          \ re.finditer(r'\\{', s):\n            try:\n                obj, _ = decoder.raw_decode(s[m.start():])\n\
          \            except ValueError:\n                continue          # 这个位置不是合法\
          \ JSON，换下一个\n            if isinstance(obj, dict):\n                data\
          \ = obj\n                break\n        if data is not None:\n         \
          \   break\n\n    if not isinstance(data, dict):\n        return {\"search_topic\"\
          : \"\", \"search_directions\": []}\n\n    # 4) 取字段（兼容几种常见命名）\n    search_topic\
          \ = (\n        data.get(\"调研主题\") or data.get(\"主题名称\") or data.get(\"主题\"\
          ) or \"\"\n    ).strip()\n    dirs = data.get(\"调研方向\") or data.get(\"方向列表\"\
          ) or data.get(\"方向\") or []\n    search_directions = [str(d).strip() for\
          \ d in dirs if str(d).strip()]\n\n    return {\n        \"search_topic\"\
          : search_topic,\n        \"search_directions\": search_directions\n    }"
        code_language: python3
